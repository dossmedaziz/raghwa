<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F3F3F3;font-family:Inter,sans-serif}a{color:#0B3B8F;text-decoration:none}a:hover{color:#082C6B}*{box-sizing:border-box}</style>
</helmet>
<div style="display:flex;min-height:100vh;color:#141414">
  <aside style="width:300px;flex:none;background:#fff;border-inline-end:1px solid #E2E2E2;height:100vh;position:sticky;top:0;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="position:relative;width:40px;height:40px;border-radius:12px;background:#0B3B8F;flex:none"><div style="position:absolute;left:10px;top:11px;width:20px;height:20px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:#22C4D6"></div></div>
      <div><div style="font-size:18px;font-weight:800">Raghwa · رغوة</div><div style="font-size:12px;color:#5E5E5E">Customer app prototype</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#5E5E5E;text-transform:uppercase;letter-spacing:.06em">Language</div>
      <div style="display:flex;padding:4px;border-radius:999px;background:#F3F3F3;gap:4px">
        <sc-for list="{{ langs }}" as="l"><button onClick="{{ l.pick }}" style="flex:1;height:36px;border-radius:999px;border:none;background:{{ l.bg }};box-shadow:{{ l.sh }};font-weight:{{ l.fw }};font-size:14px;cursor:pointer;font-family:{{ l.font }}">{{ l.label }}</button></sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;color:#5E5E5E;text-transform:uppercase;letter-spacing:.06em">Simulate</div>
      <sc-for list="{{ sims }}" as="m"><button onClick="{{ m.go }}" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid #E2E2E2;background:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:start" style-hover="background:#F6F6F6"><span style="width:8px;height:8px;border-radius:50%;background:{{ m.c }}"></span>{{ m.label }}</button></sc-for>
    </div>
    <sc-for list="{{ groups }}" as="g">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:12px;font-weight:700;color:#5E5E5E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">{{ g.title }}</div>
        <sc-for list="{{ g.items }}" as="it"><button onClick="{{ it.go }}" style="display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:8px;border:none;background:{{ it.bg }};color:{{ it.fg }};font-size:14px;font-weight:{{ it.fw }};cursor:pointer;text-align:start" style-hover="background:#F3F3F3">{{ it.label }}</button></sc-for>
      </div>
    </sc-for>
    <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #EEEEEE;padding-top:16px;font-size:14px;font-weight:600">
      <a href="Raghwa Screens.dc.html">Key screens · AR vs FR →</a>
      <a href="Raghwa Style Guide.dc.html">Style guide →</a>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:32px;gap:32px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div style="width:{{ boxW }}px;height:{{ boxH }}px;position:relative"><div style="position:absolute;top:0;left:0;width:390px;height:844px;transform:scale({{ scale }});transform-origin:0 0">
      <dc-import name="RaghwaApp" lang="{{ lang }}" nav="{{ nav }}" on-screen="{{ onScreen }}" on-lang="{{ onLang }}" hint-size="390px,844px"></dc-import>
      </div></div>
      <div style="font-size:13px;color:#5E5E5E">Demo OTP code: <b style="color:#141414">1234</b></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'ar', nav: null, n: 0, current: 'splash', active: '' };
  componentDidMount() { this.rs = () => this.forceUpdate(); window.addEventListener('resize', this.rs); }
  componentWillUnmount() { window.removeEventListener('resize', this.rs); }
  jump(to, patch) { const n = this.state.n + 1; this.setState({ n, nav: { n, to, patch }, active: to || this.state.active }); }
  renderVals() {
    const st = this.state;
    const G = [
      ['Onboarding', [['splash', 'Splash'], ['lang', 'Language picker'], ['intro', 'Intro 1 · find'], ['intro2', 'Intro 2 · time'], ['intro3', 'Intro 3 · pay']]],
      ['Auth', [['login', 'Login'], ['login:err', 'Login · errors'], ['signup', 'Sign up'], ['signup:err', 'Sign up · errors'], ['otp', 'OTP'], ['otp:err', 'OTP · wrong code'], ['forgot', 'Forgot password'], ['newpass', 'New password'], ['location', 'Location permission']]],
      ['Map', [['map', 'Map · collapsed sheet'], ['map:half', 'Map · half sheet'], ['map:expanded', 'Map · expanded sheet'], ['map:pin', 'Map · garage preview'], ['map:filters', 'Filters sheet'], ['map:loading', 'Map · loading'], ['map:denied', 'Location denied'], ['map:offline', 'No internet']]],
      ['Garage & booking', [['garage', 'Garage details'], ['garage:hours', 'Details · hours open'], ['book1', '1 · Date & slot'], ['book1:sel', '1 · Slot selected'], ['book1:loading', '1 · Slots loading'], ['book2', '2 · Services'], ['book2:err', '2 · No service error'], ['book3', '3 · Summary'], ['success', 'Success']]],
      ['Reservations', [['res', 'Upcoming'], ['res:past', 'Past'], ['res:cancelled', 'Cancelled'], ['res:loading', 'Loading'], ['res:empty', 'Empty state'], ['resd:up', 'Detail · upcoming'], ['resd:locked', 'Detail · < 2 h locked'], ['resd:past', 'Detail · past'], ['resd:cancelled', 'Detail · cancelled'], ['cancel', 'Cancel sheet'], ['resched', 'Reschedule · slot'], ['resched2', 'Reschedule · confirm'], ['rate', 'Rating sheet']]],
      ['Profile', [['profile', 'Profile'], ['cars', 'My cars'], ['carform', 'Add car'], ['carform:err', 'Add car · errors'], ['language', 'Language'], ['notif', 'Notifications'], ['changepw', 'Change password'], ['changephone', 'Change phone'], ['help', 'Help & contact'], ['terms', 'Terms'], ['logout', 'Logout dialog']]]
    ];
    const cur = st.current;
    return {
      lang: st.lang, nav: st.nav, current: cur,
      ...(() => { const sc = Math.min(1, (window.innerHeight - 100) / 844); return { scale: sc, boxW: Math.round(390 * sc), boxH: Math.round(844 * sc) }; })(),
      onScreen: s => this.setState({ current: s }),
      onLang: l => l !== this.state.lang && this.setState({ lang: l }),
      langs: [['ar', 'عربي', 'Cairo,sans-serif'], ['fr', 'Français', 'Inter,sans-serif']].map(([k, label, font]) => ({ label, font, bg: st.lang === k ? '#fff' : 'transparent', sh: st.lang === k ? '0 1px 4px rgba(0,0,0,.12)' : 'none', fw: st.lang === k ? 700 : 500, pick: () => this.setState({ lang: k }) })),
      sims: [['Toast', '#22C4D6', null, { toast: 'link_copied' }], ['No internet (map)', '#D92D20', 'map:offline'], ['Location denied', '#F5A623', 'map:denied'], ['Empty reservations', '#AFAFAF', 'res:empty']].map(([label, c, to, patch]) => ({ label, c, go: () => this.jump(to, patch) })),
      groups: G.map(([title, items]) => ({ title, items: items.map(([k, label]) => { const on = st.active === k; return { label, bg: on ? '#EDF2FC' : 'transparent', fg: on ? '#0B3B8F' : '#141414', fw: on ? 700 : 500, go: () => this.jump(k) }; }) }))
    };
  }
}
</script>
</body>
</html>
