# Development: everything runs in containers, nothing to install on the host except Docker.
#   docker compose up -d --build        → db + db-test + api (migrations run on start, hot reload on save)
#   docker compose exec api npm test    → run commands inside the api container
services:
  api:
    build:
      context: .
      target: dev
    # Apply pending migrations, then start Nest in watch mode.
    command: sh -c "npm run migration:run && npm run start:dev"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Used by `npm run test:e2e` inside this container.
      TEST_DB_HOST: db-test
      TEST_DB_PORT: 5432
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keeps the container's node_modules (Linux build) instead of the host folder.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-raghwa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raghwa}
      POSTGRES_DB: ${DB_NAME:-raghwa}
    ports:
      - "5430:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the e2e tests (in memory: wiped whenever the container restarts).
  db-test:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: raghwa
      POSTGRES_PASSWORD: raghwa
      POSTGRES_DB: raghwa_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghwa -d raghwa_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
