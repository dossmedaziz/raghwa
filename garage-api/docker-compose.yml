services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-raghwa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raghwa}
      POSTGRES_DB: ${DB_NAME:-raghwa}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the e2e tests (no volume: data is wiped on every container restart).
  db-test:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: raghwa
      POSTGRES_PASSWORD: raghwa
      POSTGRES_DB: raghwa_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghwa -d raghwa_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["test"]

  # Runs pending migrations once, then exits. The API waits for it.
  migrate:
    build: .
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/database/data-source.js", "migration:run"]
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
